<form id="contact-form" action="https://mail.denkmuskel.org/form" method="POST">
    <div class="fields">
        <div class="field half">
            <input type="text" name="name" id="name" placeholder="Name" required />
        </div>
        <div class="field half">
            <input type="email" name="email" id="email" placeholder="Email" required />
        </div>
        <div class="field">
            <textarea name="message" id="message" placeholder="Message" rows="7" required></textarea>
        </div>
        <input type="hidden" name="_subject" value="gli.al contact" />
        <input type="text" name="website" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true" />
    </div>
    <ul class="actions">
        <li><input type="submit" value="Send Message" class="button primary" /></li>
        <li><input type="reset" value="Reset" /></li>
    </ul>
    <p id="contact-status" role="status"></p>
</form>
